# A normal Compose file. Everything this tool adds lives where Compose puts
# extensions: an x-bay block, and bay.* labels on a service.
name: platform

# No x-bay block: this project uses the machine's default domain.
# Pin one here only when this project needs a domain of its own:
#
#   x-bay:
#     domain: shop.test

services:
  platform1:
    image: node:26.8.1-trixie-slim
    # No label needed: this becomes https://platform1.test/
    command:
      - node
      - -e
      - |-
        require('http').createServer((q,s)=>s.end('served by '+require('os').hostname()+' for '+q.headers.host+'\n')).listen(80)

  platform2:
    image: node:26.8.1-trixie-slim
    command:
      - node
      - -e
      - |-
        require('http').createServer((q,s)=>s.end('served by '+require('os').hostname()+' for '+q.headers.host+'\n')).listen(80)

  platform3:
    image: node:26.8.1-trixie-slim
    labels:
      bay.domain: api.platform3.test
    command:
      - node
      - -e
      - |-
        require('http').createServer((q,s)=>s.end('served by '+require('os').hostname()+' for '+q.headers.host+'\n')).listen(80)
